<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <script src="./script.js" defer></script>
    <title>Document</title>
</head>

<body>
    <div class="container-nums">
        <div class="num">1</div>
        <div class="num">2</div>
        <div class="num">3</div>
        <div class="num">4</div>
        <div class="num">5</div>
    </div>
    <div class="container">
        <div class="find-num operations-container">
            <p style="text-align: center; margin-bottom: 10px;">find() certain number in array</p>
            <input id="find-num-input" type="text">
            <button id="find-num-btn">find()</button>
        </div>
        <div class="reduce-num operations-container">
            <p style="text-align: center; margin-bottom: 10px;">reduce() for nums in array</p>
            <button id="reduce-num-btn">reduce()</button>
        </div>
        <div class="map-array operations-container">
            <p style="text-align: center; margin-bottom: 10px;">map() and see what it does</p>
            <button id="map-array-btn">map()</button>
        </div>
        <div class="fill-array operations-container">
            <p style="text-align: center; margin-bottom: 10px;">fill() and see what it does</p>
            <button id="fill-array-btn">fill()</button>
        </div>
        <div class="sort-array operations-container">
            <p style="text-align: center; margin-bottom: 10px;">'reverse' sort() and see what it does</p>
            <button id="sort-array-btn">'reverse' sort()</button>
        </div>
        <div class="filter-array operations-container">
            <p style="text-align: center; margin-bottom: 10px;">filter() and see what it does</p>
            <button id="filter-evenonly-array-btn">filter() evenOnly </button>
        </div>
        
    </div>
</body>

</html>
